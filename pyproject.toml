[project]
name = "research-utils"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deep-translator>=1.11.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "xlrd>=2.0.2",
]

[project.scripts]
merge-jcr-xlsx = "paper_utils.web_of_science.merge_jcr_xlsx:main"
translate-xls = "paper_utils.web_of_science.translate_xls:main"
wos-merge-jcr-xlsx = "paper_utils.web_of_science.merge_jcr_xlsx:main"
wos-translate-xls = "paper_utils.web_of_science.translate_xls:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_utils"]
